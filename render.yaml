services:
  - type: web
    name: diplom-zkh-payments
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: diplom-zkh-db
          property: connectionString

databases:
  - name: diplom-zkh-db
    plan: free
    databaseName: diplom_zkh
